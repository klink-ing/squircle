packages:
  - website
  - package

catalog:
  "@anolilab/semantic-release-pnpm": ^3.2.2
  "@semantic-release/commit-analyzer": ^13.0.1
  "@semantic-release/github": ^11.0.1
  "@semantic-release/release-notes-generator": ^14.0.3
  "@types/node": ^24
  conventional-changelog-conventionalcommits: ^9.3.1
  semantic-release: ^25.0.3
  tailwindcss: ^4.2.2
  typescript: ^5
  vite: npm:@voidzero-dev/vite-plus-core@^1.0.0
  vite-plus: ^1.0.0
  vitest: 5.0.3

catalogMode: prefer

overrides:
  vite: "catalog:"
  vitest: "catalog:"
  "@vitest/browser": 5.0.3
  "@vitest/browser-preview": 5.0.3
  "@vitest/mocker": 5.0.3
  "@vitest/pretty-format": 5.0.3
  "@vitest/snapshot": 5.0.3
  "@vitest/spy": 5.0.3
  "@vitest/ui": 5.0.3
  "@vitest/utils": 5.0.3
  "@vitest/expect": 5.0.3

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
