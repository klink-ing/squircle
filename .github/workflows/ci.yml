name: CI

on:
  pull_request:
    branches: [main, beta, alpha]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: ".node-version"
          cache: true

      - run: vp install

      - run: vp run ready

      - name: Install browsers for shadow regressions
        run: vp exec --filter @klinking/squircle playwright install --with-deps chromium webkit

      - name: Test pill shadows in the browser
        run: vp run @klinking/squircle#test:browser

      - name: Test the release notes
        run: node --test 'release/*.test.mjs'

      - run: npx semantic-release --dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
