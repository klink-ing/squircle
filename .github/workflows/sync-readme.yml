name: Sync README code blocks

on:
  pull_request:
    branches: [main]
    paths:
      - package/src/**
      - package/scripts/generate-squircle-css.ts
      - package/vite.config.ts
      - scripts/sync-readme.sh
      - vite.config.ts
      - README.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: ".node-version"
          cache: true

      - run: vp install

      - name: Run sync script
        run: vp run sync-readme

      - name: Fail if README is out of sync
        run: |
          if ! git diff --quiet README.md; then
            echo "::error::README is out of sync. Run 'bash scripts/sync-readme.sh' locally and push."
            git diff README.md
            exit 1
          fi
