# Deploy previews for pull requests. Production stays on GitHub Pages
# (.github/workflows/deploy-site.yml).
#
# Netlify reads this file from the repository root. `base` is set here rather
# than left to the site's UI settings, and `publish` is relative to it.
#
# Node comes from .node-version and pnpm from the packageManager field, both
# of which Netlify reads on its own.
#
# The steps are called directly rather than through `vp run website#build`:
# the vite-plus task runner builds fine locally and in GitHub Actions but
# hangs on Netlify's build image until the build times out. The package has
# to be built first because the website imports it from dist/.

[build]
base = "website"
command = "pnpm --filter @klinking/squircle exec tsx scripts/build.ts && pnpm --filter website exec astro build"
publish = "dist"
